title: Deep RL 从零到机器人行人跟随
description: >-
  一套以事实核验为核心的深度强化学习离线课程库：从 MDP / Bellman 基础出发，
  逐级覆盖 DQN、PPO、SAC 等主流算法，最终在移动机器人上部署行人跟随策略。
lang: zh-CN

# 使用 RunDocs（jekyll-rtd-theme），构建由 GitHub Pages 官方 Action 完成
remote_theme: rundocs/jekyll-rtd-theme

plugins:
  - jekyll-remote-theme

# RunDocs 主题配置：让 README.md 作为首页渲染
readme_index:
  with_frontmatter: true

# 项目子路径部署（/仓库名/）时按需调整；自定义域名根部署保持为空
baseurl: ""

exclude:
  - .github/
  - references/snapshots/
  - exercises/
  - projects/
  - papers/
  - Gemfile
  - Gemfile.lock

markdown: kramdown
kramdown:
  math_engine: mathjax
  input: GFM
